<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>InmoGesta - Registro de Contrato</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 750px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white p-3">
            <h3 class="card-title mb-0 fw-bold fs-5">
                <span th:text="${contrato.id == null} ? 'InmoGesta &bull; Apertura de Nuevo Contrato' : 'InmoGesta &bull; Modificación de Términos Contractuales'"></span>
            </h3>
        </div>
        <div class="card-body p-4">

            <!-- Mensaje de Error de Validación de Capa de Negocio -->
            <div th:if="${error}" class="alert alert-danger shadow-sm small" role="alert">
                <strong th:text="${error}"></strong>
            </div>

            <form th:object="${contrato}"
                  th:action="${contrato.id == null} ? @{/contratos/guardar} : @{/contratos/actualizar/{id}(id=${contrato.id})}"
                  method="post" class="row g-3">

                <input type="hidden" th:field="*{id}" />

                <div class="col-md-12">
                    <label class="form-label small fw-bold text-secondary">Propiedad Inmueble:</label>
                    <select th:field="*{propiedad}" class="form-select form-select-sm" th:errorclass="is-invalid">
                        <option value="">-- Seleccione una Propiedad del Inventario --</option>
                        <option th:each="propiedad : ${propiedades}"
                                th:value="${propiedad.id}"
                                th:text="${propiedad.direccion + ' - ' + propiedad.ciudad + ' [Disp: ' + propiedad.estadoDisponibilidad + ']'}">
                        </option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('propiedad')}" th:errors="*{propiedad}"></div>
                </div>

                <div class="col-md-12">
                    <label class="form-label small fw-bold text-secondary">Inquilino Titular:</label>
                    <select th:field="*{inquilino}" class="form-select form-select-sm" th:errorclass="is-invalid">
                        <option value="">-- Seleccione un Cliente Registrado --</option>
                        <option th:each="persona : ${personas}"
                                th:value="${persona.id}"
                                th:text="${persona.apellido + ', ' + persona.nombre}">
                        </option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('inquilino')}" th:errors="*{inquilino}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label small fw-bold text-secondary">Fecha de Inicio Vigencia:</label>
                    <input type="date" th:field="*{fechaInicio}" class="form-control form-control-sm" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaInicio')}" th:errors="*{fechaInicio}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label small fw-bold text-secondary">Plazo de Duración (Meses):</label>
                    <input type="number" th:field="*{duracionMeses}" class="form-control form-control-sm" th:errorclass="is-invalid" placeholder="Ej: 24">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('duracionMeses')}" th:errors="*{duracionMeses}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label small fw-bold text-secondary">Monto Mensual de Alquiler ($):</label>
                    <input type="number" step="0.01" th:field="*{importeMensual}" class="form-control form-control-sm" th:errorclass="is-invalid" placeholder="0.00">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('importeMensual')}" th:errors="*{importeMensual}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label small fw-bold text-secondary">Día de Vencimiento Mensual:</label>
                    <input type="number" th:field="*{diaVencimientoMensual}" class="form-control form-control-sm" th:errorclass="is-invalid" placeholder="Rango del 1 al 31">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('diaVencimientoMensual')}" th:errors="*{diaVencimientoMensual}"></div>
                </div>

                <div class="col-md-12">
                    <label class="form-label small fw-bold text-secondary">Descripción y Cláusulas Especiales:</label>
                    <textarea th:field="*{descripcion}" class="form-control form-control-sm" th:errorclass="is-invalid" rows="3" placeholder="Detalle aquí penalizaciones, garantías o consideraciones particulares..."></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
                </div>

                <div class="col-md-12">
                    <label class="form-label small fw-bold text-secondary">Estado Operativo del Acuerdo:</label>
                    <select th:field="*{estadoContrato}" class="form-select form-select-sm" th:errorclass="is-invalid">
                        <option th:each="estado : ${estadosContrato}"
                                th:value="${estado}"
                                th:text="${estado}">
                        </option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('estadoContrato')}" th:errors="*{estadoContrato}"></div>
                </div>

                <div class="col-md-12 d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/contratos}" class="btn btn-sm btn-outline-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn btn-sm btn-primary px-4">Confirmar Registro</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://jsdelivr.net"></script>
</body>
</html>
